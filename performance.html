<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 및 성과 관리 시스템 - 성과관리</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --primary:#533afd;--primary-deep:#4434d4;--primary-press:#2e2b8c;
  --primary-soft:#665efd;--primary-sub:#b9b9f9;--primary-bg:#eeeeff;
  --brand-dark:#1c1e54;--ink:#0d253d;--ink-2:#273951;--ink-mute:#64748d;
  --canvas:#ffffff;--canvas-soft:#f6f9fc;--hairline:#e3e8ee;--hairline-input:#a8c3de;
  --ruby:#ea2261;
  --navy:var(--brand-dark);--navy-mid:#253360;
  --blue:var(--primary);--blue-lt:var(--primary-bg);
  --teal:#00b6a8;--teal-lt:#e0f7f5;
  --amber:#e5890a;--amber-lt:#fff4e0;
  --red:#ea2261;--red-lt:#fde8ef;
  --green:#1a9e5c;--green-lt:#e3f9ef;
  --purple:var(--primary);--purple-lt:var(--primary-bg);--orange:#f97316;--orange-lt:#fff7ed;
  --gray-0:var(--canvas-soft);--gray-1:#eef0f5;--gray-2:var(--hairline);
  --gray-3:#9ba3b8;--gray-4:var(--ink-mute);--text:var(--ink);--white:#ffffff;--heading:var(--brand-dark);
  --shadow:rgba(0,55,112,.08) 0 1px 3px;
  --shadow-md:rgba(0,55,112,.08) 0 8px 24px, rgba(0,55,112,.04) 0 2px 6px;
  --shadow-lg:rgba(0,55,112,.1) 0 16px 40px, rgba(0,55,112,.06) 0 4px 12px;
  --radius:8px;
}
/* ══════════ 다크 모드 (index.html과 동일 팔레트) ══════════ */
body.dark{
  --primary:#7c6bff;--primary-deep:#6a5aff;--primary-press:#5847e6;
  --primary-soft:#8f81ff;--primary-sub:#3b3a7a;--primary-bg:#232544;
  --ink:#e7ebf3;--ink-2:#c3cad9;--ink-mute:#95a0b5;
  --canvas:#191d27;--canvas-soft:#0f131a;--hairline:#2b3242;--hairline-input:#3a4356;
  --heading:#e7ebf3;--navy:#232a48;--navy-mid:#2c355f;
  --teal:#2dd4c4;--teal-lt:#0e2f2c;--amber:#f0a83a;--amber-lt:#3a2c12;
  --red:#ff5f86;--red-lt:#3a1622;--green:#33c07a;--green-lt:#123322;
  --blue:var(--primary);--blue-lt:var(--primary-bg);--purple:var(--primary);--purple-lt:var(--primary-bg);
  --orange:#f7a04a;--orange-lt:#3a2810;
  --gray-1:#232a36;--gray-3:#7d879a;
  --shadow:rgba(0,0,0,.4) 0 1px 3px;--shadow-md:rgba(0,0,0,.45) 0 8px 24px;--shadow-lg:rgba(0,0,0,.55) 0 16px 40px;
  color-scheme:dark;
}
body.dark .page-title,body.dark .card-title,body.dark .chart-title,body.dark .modal-header h3,body.dark .detail-title{color:#f4f6fb!important;}
body.dark .year-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;}
body.dark .badge-required{background:#3a2c12;color:#f3c37a;}
body.dark [style*="#fef3c7"]{background:#3a2c12!important;color:#f3c37a!important;}
body.dark [style*="#eef2ff"],body.dark [style*="#eeeeff"]{background:#252a48!important;}
body.dark table tr:hover td{background:#222b3a;}
body.dark input::placeholder,body.dark textarea::placeholder{color:#697488;}
body.dark ::-webkit-scrollbar{width:12px;height:12px;}
body.dark ::-webkit-scrollbar-thumb{background:#333c4d;border-radius:6px;border:3px solid var(--canvas-soft);}
.theme-toggle{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:9999px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0;flex-shrink:0;}
.theme-toggle:hover{background:rgba(255,255,255,.24);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','SF Pro Display',system-ui,sans-serif;background:var(--gray-0);color:var(--text);}

/* HEADER */
.header{background:var(--navy);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.header-left{display:flex;align-items:center;gap:12px;}
.back-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s;}
.back-btn:hover{background:rgba(255,255,255,.2);}
.header-title{color:#fff;font-size:16px;font-weight:700;}
.header-badge{background:var(--teal);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.sync-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
.sync-status{font-size:11px;color:rgba(255,255,255,.6);margin-left:8px;}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 60px);}
.sidebar{width:240px;background:var(--canvas);border-right:1px solid var(--gray-1);padding:20px 0;flex-shrink:0;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.sidebar-section{padding:10px 16px 4px;font-size:10px;font-weight:700;color:var(--gray-3);letter-spacing:.08em;text-transform:uppercase;}
.sidebar-menu{list-style:none;}
.sidebar-menu li a{display:flex;align-items:center;gap:8px;padding:10px 18px;font-size:13px;font-weight:500;color:var(--gray-4);cursor:pointer;border-left:3px solid transparent;transition:all .15s;}
.sidebar-menu li a:hover,.sidebar-menu li a.active{background:var(--blue-lt);color:var(--blue);border-left-color:var(--blue);}
.content{flex:1;padding:28px 32px;overflow-x:hidden;}

/* CARDS */
.page-title{font-size:22px;font-weight:300;letter-spacing:-.5px;color:var(--heading);margin-bottom:4px;}
.page-subtitle{font-size:13px;color:var(--gray-4);margin-bottom:24px;}
.card{background:var(--canvas);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;margin-bottom:20px;}
.card-title{font-size:15px;font-weight:800;color:var(--heading);margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.stat-card{background:var(--canvas);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border-top:4px solid var(--gray-2);}
.stat-card.green{border-top-color:var(--green);}
.stat-card.blue{border-top-color:var(--blue);}
.stat-card.amber{border-top-color:var(--amber);}
.stat-card.red{border-top-color:var(--red);}
.stat-label{font-size:11px;font-weight:600;color:var(--gray-4);margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:900;font-family:monospace;color:var(--heading);}
.stat-sub{font-size:11px;color:var(--gray-3);margin-top:4px;}

/* INDICATOR TABLE */
.indicator-table{width:100%;border-collapse:collapse;font-size:13px;}
.indicator-table th{background:var(--ink);color:#fff;padding:10px 12px;text-align:left;font-size:12px;font-weight:600;white-space:nowrap;}
.indicator-table td{padding:10px 12px;border-bottom:1px solid var(--gray-1);vertical-align:top;}
.indicator-table tr:last-child td{border-bottom:none;}
.indicator-table tr:hover td{background:var(--gray-0);}

/* BADGE */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-required{background:#fef3c7;color:#92400e;}
.badge-advanced{background:var(--purple-lt);color:var(--purple);}
.badge-green{background:var(--green-lt);color:#1a6e2e;}
.badge-amber{background:var(--amber-lt);color:#7a5000;}
.badge-red{background:var(--red-lt);color:var(--red);}
.badge-gray{background:var(--gray-1);color:var(--gray-4);}
.badge-blue{background:var(--blue-lt);color:var(--blue);}

/* PROGRESS */
.progress-wrap{display:flex;align-items:center;gap:8px;min-width:120px;}
.progress-bar{flex:1;height:8px;background:var(--gray-1);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;border-radius:4px;transition:width .5s;}
.progress-fill.green{background:var(--green);}
.progress-fill.blue{background:var(--blue);}
.progress-fill.amber{background:var(--amber);}
.progress-fill.red{background:var(--red);}
.progress-label{font-family:monospace;font-size:12px;white-space:nowrap;font-weight:600;}

/* CHART CONTAINER */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.chart-box{background:var(--canvas);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.chart-box.full{grid-column:1/-1;}
.chart-title{font-size:14px;font-weight:700;color:var(--heading);margin-bottom:14px;}
.chart-container{position:relative;height:260px;}

/* MAPPING */
.mapping-section{margin-top:16px;}
.mapping-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--gray-1);border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:background .15s;}
.mapping-row:hover{background:var(--gray-0);}
.mapping-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex-shrink:0;}
.mapping-row .prog-name{flex:1;font-weight:500;}
.mapping-row .prog-meta{font-size:11px;color:var(--gray-4);}
.mapping-row .prog-value{font-size:12px;font-weight:600;color:var(--blue);font-family:monospace;}

/* DETAIL PANEL */
.detail-panel{background:var(--gray-0);border-radius:8px;padding:14px;margin-top:12px;font-size:13px;}
.detail-row{display:flex;gap:8px;margin-bottom:6px;}
.detail-label{color:var(--gray-4);font-weight:600;min-width:80px;flex-shrink:0;}
.detail-val{color:var(--text);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:20px 0;overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal{background:var(--canvas);border-radius:14px;width:760px;max-width:96vw;margin:auto;box-shadow:var(--shadow-lg);}
.modal-header{padding:20px 24px 14px;border-bottom:1px solid var(--gray-1);display:flex;align-items:center;justify-content:space-between;}
.modal-header h3{font-size:17px;font-weight:800;color:var(--heading);}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--gray-3);}
.modal-body{padding:20px 24px;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--gray-1);display:flex;justify-content:flex-end;gap:10px;}

/* FORM */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--gray-4);margin-bottom:5px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--gray-2);border-radius:7px;font-family:inherit;font-size:13px;color:var(--text);background:var(--canvas);}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(83,58,253,.1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-row.triple{grid-template-columns:1fr 1fr 1fr;}

/* BUTTONS */
.btn{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:all .18s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#1a44e8;}
.btn-ghost{background:transparent;color:var(--gray-4);border:1px solid var(--gray-2);}
.btn-ghost:hover{background:var(--gray-1);}
.btn-sm{padding:5px 12px;font-size:12px;}
.btn-xs{padding:3px 8px;font-size:11px;}
.btn-teal{background:var(--teal);color:#fff;}
.btn-danger{background:var(--red);color:#fff;}
.btn-amber{background:var(--amber);color:#fff;}

/* ALERT */
.alert{border-radius:8px;padding:11px 16px;font-size:13px;margin-bottom:14px;}
.alert-blue{background:var(--blue-lt);border:1px solid var(--blue);color:#1a3abf;}
.alert-green{background:var(--green-lt);border:1px solid var(--green);color:#1a6e2e;}

/* YEAR TABS */
.year-tabs{display:flex;gap:6px;margin-bottom:20px;}
.year-tab{padding:8px 20px;border-radius:20px;border:1.5px solid var(--gray-2);font-size:13px;font-weight:600;cursor:pointer;color:var(--gray-4);background:var(--canvas);}
.year-tab.active{background:var(--ink);color:#fff;border-color:var(--heading);}

/* TOAST */
.info-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:600;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;}
.info-popup{background:var(--canvas);border-radius:14px;width:780px;max-width:96vw;box-shadow:0 16px 48px rgba(0,0,0,.25);overflow:hidden;}
.info-popup-header{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;}
.info-popup-header h3{font-size:17px;font-weight:800;}
.info-popup-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.info-popup-body{padding:22px 24px;max-height:75vh;overflow-y:auto;}
.info-section{margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--gray-1);}
.info-section:last-child{border-bottom:none;margin-bottom:0;}
.info-section-title{font-size:12px;font-weight:700;color:var(--gray-4);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.info-section-body{font-size:13px;color:var(--text);line-height:1.75;white-space:pre-wrap;}
.info-tag{display:inline-block;background:var(--blue-lt);color:var(--blue);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600;margin-right:4px;margin-bottom:4px;}
.info-tag.amber{background:var(--amber-lt);color:#8a6000;}
.info-tag.green{background:var(--green-lt);color:#1a6e2e;}
.info-btn{background:none;border:1px solid var(--gray-2);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--gray-4);margin-left:6px;}
.info-btn:hover{background:var(--blue-lt);color:var(--blue);border-color:var(--primary);box-shadow:0 0 0 3px rgba(83,58,253,.1);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;box-shadow:var(--shadow-lg);z-index:999;opacity:0;transform:translateY(12px);transition:all .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}

/* TARGET VALUE DISPLAY */
.target-years{display:flex;gap:6px;flex-wrap:wrap;}
.target-year-chip{background:var(--gray-1);border-radius:4px;padding:2px 8px;font-size:11px;font-family:monospace;}
.target-year-chip.current{background:var(--blue-lt);color:var(--blue);font-weight:700;}

/* 현재값 입력 */
.current-val-input{width:90px;padding:4px 8px;border:1.5px solid var(--blue);border-radius:5px;font-size:12px;font-family:monospace;text-align:center;}

/* ── 모바일 햄버거 버튼 ── */
.hamburger-perf{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;padding:7px 10px;border-radius:6px;font-size:18px;cursor:pointer;line-height:1;margin-right:4px;}
.sidebar-overlay-perf{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}

@media(max-width:768px){
  /* 햄버거 표시 */
  .hamburger-perf{display:flex;align-items:center;justify-content:center;}
  /* 사이드바: 슬라이드 방식 */
  .sidebar{
    position:fixed!important;top:0;left:0;bottom:0;
    width:260px!important;z-index:60;
    transform:translateX(-100%);transition:transform .28s ease;
    height:100vh;padding-top:16px;
    box-shadow:4px 0 20px rgba(0,0,0,.25);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay-perf.show{display:block;}
  /* 레이아웃 */
  .layout{display:block;}
  .content{padding:14px 12px;width:100%;overflow-x:hidden;max-width:100vw;}
  /* 통계 */
  .stat-grid{grid-template-columns:repeat(2,1fr)!important;gap:8px!important;}
  .stat-card{padding:12px 10px;}
  .stat-value{font-size:22px!important;}
  /* 차트 */
  .chart-grid{grid-template-columns:1fr!important;}
  .chart-box.full{grid-column:1!important;}
  .chart-container{height:200px!important;}
  /* 테이블 */
  .indicator-table{font-size:11px;}
  .indicator-table th,.indicator-table td{padding:6px 5px;white-space:nowrap;}
  /* 카드 */
  .card{padding:14px 12px;}
  .card-title{font-size:13px;}
  .page-title{font-size:18px!important;}
  .page-subtitle{font-size:12px;}
  /* 버튼 */
  .btn{padding:6px 10px;font-size:12px;}
  .btn-sm{padding:5px 8px;font-size:11px;}
  .btn-xs{padding:3px 7px;font-size:11px;}
  /* 헤더 */
  .header-title{font-size:12px;}
  .header-badge{font-size:9px;padding:2px 5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sync-status{display:none;}
  /* 모달 */
  .modal{width:96vw!important;max-height:90vh;overflow-y:auto;}
  .modal-body{padding:14px 12px;}
  .modal-header{padding:12px 14px 8px;}
  .modal-footer{padding:10px 14px;}
  .form-row,.form-row.triple{grid-template-columns:1fr!important;gap:0!important;}
  /* 매핑 */
  .mapping-row{flex-wrap:wrap;gap:6px;}
  .progress-wrap{min-width:80px;}
  .progress-bar{min-width:40px;}
  table{min-width:100%;}
  .table-wrap-mobile{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="hamburger-perf" onclick="togglePerfSidebar()" id="hamburger-perf">☰</button>
    <button class="back-btn" onclick="goBack()">← 메인으로</button>
    <div class="header-title">📊 성과 관리</div>
    <span class="header-badge">교육국제화역량 인증제(IEQAS)</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="theme-toggle" onclick="toggleDarkMode()" title="다크모드 전환" aria-label="다크모드 전환">🌙</button>
    <span class="sync-status" id="sync-status">✓ 연동됨</span>
    <button class="sync-btn" onclick="refreshAll()">🔄 새로고침</button>
  </div>
</header>

<div class="sidebar-overlay-perf" id="sidebar-overlay-perf" onclick="closePerfSidebar()"></div>
<div class="layout">
  <nav class="sidebar" id="perf-sidebar">
    <ul class="sidebar-menu">
      <div class="sidebar-section">성과 개요</div>
      <li><a onclick="showTab('overview')" class="active">📊 전체 현황</a></li>
      <li><a onclick="showTab('chart')">📈 차트 분석</a></li>
      <div class="sidebar-section">지표별 관리</div>
      <li><a onclick="showTab('fee')">💰 유학생 등록금 부담률</a></li>
      <li><a onclick="showTab('law')">⚖️ 한국법령 이해교육</a></li>
      <li><a onclick="showTab('industry')">🏭 산학협력 노력</a></li>
      <li><a onclick="showTab('life')">🏠 생활 및 진로지원</a></li>
      <li><a onclick="showTab('employ')">💼 유학생 취업률</a></li>
      <li><a onclick="showTab('visa')">🛂 우수 비자 전환율</a></li>
      <div class="sidebar-section">관리자</div>
      <li><a onclick="showTab('mapping')">🔗 프로그램 매핑</a></li>
      <li><a onclick="showTab('settings-perf')">⚙️ 지표 설정</a></li>
    </ul>
  </nav>
  <div class="content" id="main-content"></div>
</div>

<!-- MODAL: 지표 직접 입력 -->
<div class="modal-overlay" id="modal-input">
  <div class="modal">
    <div class="modal-header">

let _fbTasksLoaded = false;   // Firebase 프로그램 목록 최초 수신 여부
let _fbPerfLoaded  = false;   // Firebase 성과(perf) 데이터 최초 수신 여부
let _fbSettingsDepts = null;  // 설정(sj_v1/settings)의 학과 목록 (대상 학과 설정 드롭다운용)

// 익명 인증 (DB 규칙 auth != null 대응) — tasks/perf 저장·구독 전에 공통으로 대기

// 성과(IEQAS) 데이터 실시간 로드 — 입력값/매핑/대상학과 등 (index.html 결과보고서 화면과 공유되는 핵심 경로)
// 과거에는 localStorage + Apps Script(수동 새로고침)만 사용해 기기·브라우저가 다르면 서로 반영되지 않는 문제가 있었음
async function _initFirebasePerf() {
  if (!_pdb) return;
  try {
    await _authReady;
    _pdb.ref('sj_v1/perf').on('value', snap => {
      const val = snap.val();
      _fbPerfLoaded = true;
      if (val && Object.keys(val).length) {
        // ⚠ 과거 문제(근본 원인): 서버 스냅샷을 localStorage에 그대로 덮어썼기 때문에,
        //   방금 저장한 값이 아직 서버에 업로드되기 전(_fbSetPerf 완료 전)에 뒤늦은/오래된 스냅샷이 도착하면
        //   방금 입력한 학기실적·입력값이 통째로 초기화되었다.
        //   → 이제는 지표별 updatedAt을 비교해, 로컬이 더 최근이면 로컬의 performance.html 관리 필드를 보존하고,
        //     linkedRecords(index.html 결과보고서가 관리)만 서버 값을 받아들여 병합한다.
        const merged = _mergeServerIntoLocal(val, getPerfData());
        try { localStorage.setItem(STORE_KEY+'_perf', JSON.stringify(merged)); } catch(e){}
        // 저장된 목표값을 지표 정의에 즉시 반영
        IEQAS_PROJECT.indicators.forEach(ind => {
          const d = merged[ind.id] || {};
          if (d.targets) {
            ['2026','2027','2028'].forEach(y => { if (d.targets[y] !== undefined) ind.targets[y] = d.targets[y]; });
          }
        });
      }
      if (typeof currentTab !== 'undefined' && currentTab) showTab(currentTab);
      // (주의) 값 수정 모달이 열려 있을 때는 openInputModal로 재렌더하지 않는다.
      //   재렌더하면 사용자가 입력 중인 "가. 입력값" 행이 저장 전 초기화되어 사라지기 때문.
    });
  } catch(e) { console.warn('Firebase perf 로드 실패:', e); }
}

// 서버 perf 스냅샷을 로컬(localStorage) perf에 병합.
//  - performance.html 관리 필드(achievedXX·inputRecords·targets·manualVal·targetDepts·memo·fee/lawData 등):
//    지표별 updatedAt이 로컬이 더 최근이면 로컬을 보존(아직 서버에 반영 안 된 최근 저장분 보호), 아니면 서버 값 채택
//  - linkedRecords(index.html 결과보고서가 관리): 항상 서버 값을 채택(서버에 있으면)
function _mergeServerIntoLocal(server, local) {
  server = server || {}; local = local || {};
  const out = JSON.parse(JSON.stringify(server));
  // 매핑은 로컬 우선(방금 사용자가 편집했을 수 있음)
  if (local._mappings && !server._mappings) out._mappings = local._mappings;
  Object.keys(local).forEach(k => {
    if (k === '_mappings') return;
    const l = local[k], s = server[k];
    if (!l || typeof l !== 'object') return;
    if (!s) { out[k] = l; return; }                 // 서버에 아직 없음 → 로컬 유지
    const lu = l.updatedAt || '', su = s.updatedAt || '';
    if (lu && lu > su) {
      // 로컬이 더 최근: 로컬 필드 유지, 단 linkedRecords는 서버가 있으면 서버 값 사용
      out[k] = { ...l, linkedRecords: Array.isArray(s.linkedRecords) ? s.linkedRecords : l.linkedRecords };
    }
    // else: 서버가 최신이거나 동일 → 서버 값 유지(out에 이미 있음)
  });
  return out;
}
// 설정(sj_v1/settings)의 학과 목록 실시간 로드 — 대상 학과 설정 드롭다운이 항상 최신 설정을 반영하도록
async function _initFirebaseSettings() {
  if (!_pdb) return;
  try {
    await _authReady;
    _pdb.ref('sj_v1/settings').on('value', snap => {
      const val = snap.val();
      if (val && Array.isArray(val.departments)) {

        // 값 수정(실적입력) 모달이 열려 있으면 대상 학과 드롭다운을 최신 설정으로 갱신

        }

  } catch(e) { console.warn('Firebase settings 로드 실패:', e); }
}
// ⚠ 과거 문제: 이 함수가 로컬 perf 전체를 그대로 .set()으로 덮어써서, index.html(결과보고서)이 방금 추가한
//    linkedRecords("다. 연계 결과")를, 이 브라우저의 로컬 perf가 아직 최신이 아닐 때 통째로 지워버리는 일이 있었음.
//    → 이제는 저장 직전에 서버 최신값을 다시 읽어, 서버측 연계 결과를 보존하며 병합한 뒤 저장한다.
async function _fbSetPerf(d) {
  if (!_pdb) return;
  const el = document.getElementById('sync-status');
  try {
    await _authReady;
    const ref = _pdb.ref('sj_v1/perf');
    const snap = await ref.once('value');          // 저장 직전 서버 최신값 확인 (read-modify-write)
    const server = snap.val() || {};
    const merged = _mergePerfPreserveLinked(server, d, _fbPerfLoaded);
    await ref.set(merged);
    try { localStorage.setItem(STORE_KEY+'_perf', JSON.stringify(merged)); } catch(e){}
    if (el) { el.textContent = '✓ 저장됨'; el.style.color = 'rgba(100,255,150,.9)'; }
  } catch(e) {
    console.warn('Firebase perf 저장 실패:', e);
    if (el) { el.textContent = '⚠ 저장실패'; el.style.color = 'rgba(255,150,100,.9)'; }
  }
}
// 저장 시 서버의 "다. 연계 결과"(linkedRecords)를 보호하는 병합 규칙:
// - 로컬이 해당 지표 자체를 모르면 → 서버값 유지
// - 로컬이 지표는 알지만 linkedRecords가 없으면 → 서버의 linkedRecords 유지
// - 로컬 perf가 아직 서버와 1회도 동기화되지 않았으면(localFresh=false) → 항상 서버 linkedRecords 우선(오래된 로컬로 덮어쓰기 방지)
// - 그 외(로컬이 최신이고 linkedRecords를 직접 관리 중)에는 → 로컬 우선(삭제·수정 반영)
function _mergePerfPreserveLinked(server, local, localFresh) {
  const out = JSON.parse(JSON.stringify(local || {}));
  Object.keys(server || {}).forEach(k => {
    if (k === '_mappings') return;                 // 매핑은 방금 사용자가 편집한 로컬이 우선
    const s = server[k];
    if (!s || typeof s !== 'object' || !Array.isArray(s.linkedRecords)) return;
    const l = out[k];
    if (!l) {
      out[k] = JSON.parse(JSON.stringify(s));
    } else if (!Array.isArray(l.linkedRecords) || !localFresh) {
      out[k] = { ...l, linkedRecords: JSON.parse(JSON.stringify(s.linkedRecords)) };
    }
    // else: 로컬이 최신이며 linkedRecords 보유 → 로컬 우선
  });
  return out;
}

// 연도 선택 목록 (index.html의 _ieqasYearOptions와 동일 규칙)
function _ieqasYearOptions(cur) {
  const base = new Date().getFullYear();
  const sel = cur || base; // 값이 없는 새 행은 올해를 기본 선택
  const years = [];
  for (let y = base - 2; y <= base + 3; y++) years.push(y);
  if (sel && !years.includes(Number(sel))) years.push(Number(sel));
  years.sort((a,b)=>a-b);
  return years.map(y => `<option value="${y}" ${String(y)===String(sel)?'selected':''}>${y}년</option>`).join('');
}
// 학기 선택 목록 (1/2학기)
function _ieqasSemOptions(cur) {
  return ['1학기','2학기'].map(s => `<option value="${s}" ${s===cur?'selected':''}>${s}</option>`).join('');
}

// 전체 학과 목록 (대상 학과 설정용) — 설정(sj_v1/settings)의 학과 목록을 우선 사용하고,
// 프로그램(tasks)에서 실제 사용된 학과도 합쳐 누락 없이 보여준다. (설정에서 학과가 바뀌면 즉시 반영)
function getAllDepartments() {
  const set = new Set();
  // 1) 설정(설정 화면에서 관리하는 학과 목록) — 최우선
  let settingsDepts = _fbSettingsDepts;
  if (!settingsDepts) {
    try { settingsDepts = JSON.parse(localStorage.getItem(STORE_KEY+'_settings_depts')) || null; } catch(e){ settingsDepts = null; }
  }
  (settingsDepts || []).forEach(d => { if (d) set.add(d); });
  // 2) 프로그램에서 실제 입력된 학과 (설정에 없을 수도 있으니 보완)
  (tasks || []).forEach(t => {
    (t.divisionData || []).forEach(dv => { if (dv && dv.dept) set.add(dv.dept); });
    if (t.dept) set.add(t.dept);
  });
  // 3) 아무것도 없으면 최소 기본값
  if (!set.size) ['글로벌뿌리산업공학과','글로벌요양복지과','글로벌섬유비즈니스학과'].forEach(d=>set.add(d));
  return [...set].sort((a,b)=>a.localeCompare(b,'ko'));
}

  const d = getPerfData();
  d[id] = { ...(d[id]||{}), ...data, updatedAt: new Date().toISOString() };
  savePerfData(d);
}

}

}

let _syncTimer = null;
function scheduleSyncPerf() {
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(syncPerfToServer, 2000);
}
async function syncPerfToServer() {
  if (APPS_SCRIPT_URL.includes('YOUR_SCRIPT_ID')) return;
  const el = document.getElementById('sync-status');
  try {
    const chunk = { action: 'savePerf', perf: getPerfData() };
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(chunk)
    });
    // no-cors는 응답 확인 불가 → 성공으로 간주
    el.textContent = '✓ 저장됨';
    el.style.color = 'rgba(100,255,150,.9)';
  } catch(e) {
    el.textContent = '⚠ 저장실패';
    el.style.color = 'rgba(255,150,100,.9)';
  }
}

  // Firebase가 단일 소스 오브 트루스. 서버 최신값을 다시 읽어 tasks/perf를 갱신한다.
  // (과거: 구글시트 getAll에서 tasks/perf를 덮어썼으나, 시트가 오래되어 Firebase 전체 목록을 일부로 덮어쓰는 문제가 있어 제거)
  try {
    if (_pdb) {
      await _authReady;
      const [tsnap, psnap] = await Promise.all([
        _pdb.ref('sj_v1/tasks').once('value'),
        _pdb.ref('sj_v1/perf').once('value')
      ]);
      const tval = tsnap.val();
      const arr = tval ? (Array.isArray(tval) ? tval.filter(Boolean) : Object.values(tval)) : [];
      if (arr.length) { tasks = arr; try { localStorage.setItem(STORE_KEY+'_tasks', JSON.stringify(arr)); } catch(e){} }
      const pval = psnap.val();
      if (pval && Object.keys(pval).length) { try { localStorage.setItem(STORE_KEY+'_perf', JSON.stringify(pval)); } catch(e){} }
    } else {
      tasks = getTasks();
    }
  } catch(e) { console.warn('새로고침 실패:', e); tasks = getTasks(); }
  showTab(currentTab);
  toast('최신 데이터로 갱신됨', 'success');
}

// 학기별 실적 자동 집계 — 가.입력값 + 나.연계결과 중 해당 연도·학기 레코드를 집계.
// 25-2 = 2025년 2학기, 26-1 = 2026년 1학기, 26-2 = 2026년 2학기
// 실적을 직접 입력하지 않고 프로그램의 분반별 참여인원에서 자동 연계하는 지표 (index.html의 IEQAS_AUTO_INDS와 동일)
// 이 지표들은 직접 입력한 가.입력값(inputRecords)을 카운트에서 제외하고, 오직 자동 연계된 나.연계결과(linkedRecords)만 사용한다.
const IEQAS_AUTO_INDS = new Set(['industry_settle','industry_intern','industry_region']);
// 지표별 카운트 대상 레코드 = 가.입력값(inputRecords) + 나.연계결과(linkedRecords) (모든 IEQAS 지표 공통)
function _ieqasCountRecords(indicator){
  const d = getIndicatorData(indicator.id);
  const direct = Array.isArray(d.inputRecords) ? d.inputRecords : [];
  const linked = Array.isArray(d.linkedRecords) ? d.linkedRecords : [];
  return direct.concat(linked);
}

const SEM_YEAR_MAP = { '25_2': ['2025','2학기'], '26_1': ['2026','1학기'], '26_2': ['2026','2학기'] };
function calcSemValue(indicator, key) {
  const ym = SEM_YEAR_MAP[key];
  if (!ym) return null;
  const [year, sem] = ym;
  const all = _ieqasCountRecords(indicator)
    .filter(r => String(r.year) === String(year) && String(r.sem) === sem);
  if (all.length === 0) return null;   // 해당 학기 레코드 없음 → 자동값 없음
  if (indicator.mappingType === 'participants') {
    const toNum = v => Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')) || 0;
    return all.reduce((s, r) => s + toNum(r.participants), 0);
  }
  return all.length;  // 건수
}
// 학기 실적 효과값: 저장된 수동 override > 자동 집계(연계) > seed
// (자동 연계 지표도 수동 입력을 허용 — 직접 입력하면 그 값이 우선하고, 비우면 다시 자동 집계값 사용)
function getSemValue(indicator, key) {
  const d = getIndicatorData(indicator.id);
  const ov = d['achieved'+key];
  if (ov !== undefined && ov !== null && ov !== '') return Number(ov);
  const auto = calcSemValue(indicator, key);
  if (auto !== null) return auto;
  const seed = indicator['achieved'+key];
  return (seed === undefined) ? null : seed;
}

// 현재값 계산 — 저장된 데이터(가.입력값 + 다.연계결과)만으로 집계한다.
// ⚠ 이전 근본 원인: 이 함수가 live `tasks` 배열에서 계산했기 때문에,
//   ① 로그인 직후 tasks가 아직 로드되기 전에는 null→기본값으로 떨어졌다가, tasks가 도착하면 값이 튀어오르는
//      "매 로그인마다 반복되는 flip-flop" 현상이 있었고,
//   ② 사용자가 결과보고서에서 입력해 쌓아온 "다. 연계 결과"(linkedRecords)가 현재값 집계에 전혀 반영되지 않았다.
//   → 이제는 perf(로컬스토리지에서 즉시 사용 가능 + Firebase로 동기화)에 저장된 가+다 레코드로만 계산 → 즉시·안정적.
function calcMappedValue(indicator) {
  const all = _ieqasCountRecords(indicator);  // 자동 지표는 linkedRecords만, 그 외는 가+나
  if (all.length === 0) return null;  // 저장된 실적이 없으면 기본값(currentVal) 사용

  const toNum = v => Number(String(v==null?'':v).replace(/[^0-9.\-]/g,'')) || 0;
  switch (indicator.mappingType) {
    case 'participants':
      // 참여 인원 합계
      return all.reduce((sum, r) => sum + toNum(r.participants), 0);
    case 'manual':
      return null; // 수동 입력만 사용
    case 'count':
    default:
      // 건수 = 레코드 수
      return all.length;
  }
}

function overallStatus(stages) {
  if (!stages) return '미진행';
  const v = Object.values(stages);
  if (v.every(x => x==='완료'||x==='PASS')) return '완료';
  if (v.some(x => x==='진행중'||x==='완료')) return '진행중';
  return '미진행';
}

// 최종 현재값:
//  - 연계/직접입력 지표(IEQAS_INPUT_SCHEMA): 2026학년도 실적 = 25-2학기 + 26-1학기 (각 학기값 = 수동 override > 연계자동 > seed)
//    → 학기 실적을 직접 입력하거나 참여인원이 연계되면 그만큼 현재값에 반영됨
//  - fee·law 등: 수동입력 > 매핑계산 > 기본값
function getFinalValue(indicator) {
  const d = getIndicatorData(indicator.id);
  if (IEQAS_INPUT_SCHEMA[indicator.id]) {
    const v252 = getSemValue(indicator, '25_2');
    const v261 = getSemValue(indicator, '26_1');
    if (v252 == null && v261 == null) return indicator.currentVal;  // 실적 없음 → 0
    return (Number(v252)||0) + (Number(v261)||0);
  }
  if (d.manualVal !== undefined && d.manualVal !== null && d.manualVal !== '') {
    return Number(d.manualVal);
  }
  const mapped = calcMappedValue(indicator);
  if (mapped !== null) return mapped;
  return indicator.currentVal;
}

function getEffectiveTarget(indicator) {
  // 저장된 목표값 우선, 없으면 기본값
  const d = getIndicatorData(indicator.id);
  if (d.targets && d.targets['2026'] !== undefined) {
    // 메모리에도 반영
    indicator.targets['2026'] = d.targets['2026'];
    indicator.targets['2027'] = d.targets['2027'] ?? indicator.targets['2027'];
    indicator.targets['2028'] = d.targets['2028'] ?? indicator.targets['2028'];
  }
  return indicator.targets['2026'];
}

function getAchieveRate(indicator) {
  const cur = getFinalValue(indicator);
  const target = getEffectiveTarget(indicator);
  if (!target) return null;
  return Math.round(cur / target * 100);
}

function getRateColor(rate) {
  if (rate >= 100) return 'green';
  if (rate >= 80)  return 'blue';
  if (rate >= 60)  return 'amber';
  return 'red';
}
function getRateBadge(rate) {
  if (rate >= 100) return '<span class="badge badge-green">달성</span>';
  if (rate >= 80)  return '<span class="badge badge-blue">근접</span>';
  if (rate >= 60)  return '<span class="badge badge-amber">주의</span>';
  return '<span class="badge badge-red">미달</span>';
}

const $c = () => document.getElementById('main-content');

function showTab(tab) {
  currentTab = tab;
  // 모바일: 탭 선택 시 사이드바 자동 닫기
  if (window.innerWidth <= 768) closePerfSidebar();
  // 사이드바 active
  document.querySelectorAll('.sidebar-menu li a').forEach(a => {
    a.classList.toggle('active', a.getAttribute('onclick') && a.getAttribute('onclick').includes("'"+tab+"'"));
  });
  // 차트 제거
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e) {} });
  charts = {};

  const renders = {
    overview: renderOverview,
    chart: renderCharts,
    fee: () => renderIndicatorDetail('fee'),
    law: () => renderIndicatorDetail('law'),
    industry: renderIndustry,
    life: renderLife,
    employ: () => renderIndicatorDetail('employ'),
    visa: () => renderIndicatorDetail('visa'),
    mapping: renderMapping,
    'settings-perf': renderSettingsPerf,
  };
  if (renders[tab]) $c().innerHTML = renders[tab]();
  else $c().innerHTML = renderOverview();

  // 차트 그리기 - requestAnimationFrame으로 DOM 완전 렌더링 후 실행
  const INDICATOR_TABS = ['fee','law','industry_mou','industry_fair','industry_settle','industry_intern','industry_region','life','career','employ','visa'];
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      if (tab === 'overview') drawOverviewCharts();
      if (tab === 'chart') drawAllCharts();
      if (INDICATOR_TABS.includes(tab)) drawIndicatorChart(tab);
    });
  });
}

function renderOverview() {
  const inds = IEQAS_PROJECT.indicators;
  const achieved = inds.filter(i => (getAchieveRate(i)||0) >= 100).length;
  const near = inds.filter(i => { const r=getAchieveRate(i)||0; return r>=80&&r<100; }).length;
  const warn = inds.filter(i => { const r=getAchieveRate(i)||0; return r>=60&&r<80; }).length;
  const fail = inds.filter(i => (getAchieveRate(i)||0) < 60).length;

  const rows = inds.map(ind => {
    const cur = getFinalValue(ind);
    const target = ind.targets['2026'];
    const rate = getAchieveRate(ind);
    const color = getRateColor(rate||0);
    const mappings = getMappings();
    const isMapped = (mappings[ind.id]||[]).length > 0;
    return `<tr>
      <td><span class="badge ${ind.type==='required'?'badge-required':'badge-advanced'}">${ind.type==='required'?'필수':'고도화'}</span></td>
      <td style="font-size:11px;color:var(--gray-4)">${ind.group}</td>
      <td style="max-width:200px;font-size:13px"><strong>${ind.name}</strong></td>
      <td style="font-family:monospace;font-size:12px;text-align:center">${target}${ind.unit}</td>
      <td style="font-family:monospace;font-size:13px;font-weight:700;text-align:center;color:var(--heading)">${cur}${ind.unit}</td>
      <td>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill ${color}" style="width:${Math.min(rate||0,100)}%"></div></div>
          <span class="progress-label ${color==='green'?'':''}${rate>=100?'text-green':''}" style="color:${color==='green'?'var(--green)':color==='red'?'var(--red)':color==='amber'?'var(--amber)':'var(--blue)'}">${rate||0}%</span>
        </div>
      </td>
      <td>${getRateBadge(rate||0)}</td>
      <td>${isMapped?'<span class="badge badge-blue">매핑됨</span>':'<span class="badge badge-gray">미매핑</span>'}</td>
      <td>
        <button class="btn btn-xs" style="background:var(--amber-lt);color:#7a5000;border:1px solid var(--amber);margin-right:3px" onclick="openInfoPopup('${ind.id}')">📖</button>
        <button class="btn btn-sm btn-teal" onclick="openInputModal('${ind.id}')" style="margin-right:3px">실적 입력</button>
        <button class="btn btn-sm btn-ghost" onclick="openMappingModal('${ind.id}')">매핑</button>
      </td>
    </tr>`;
  }).join('');

  return `
  <div class="page-title">📊 IEQAS 성과 현황</div>
  <div class="page-subtitle">${IEQAS_PROJECT.name} · 2026년도 기준 (${new Date().toLocaleDateString('ko-KR')} 기준)</div>

  <div class="stat-grid">
    <div class="stat-card green"><div class="stat-label">목표 달성</div><div class="stat-value">${achieved}</div><div class="stat-sub">100% 이상 지표</div></div>
    <div class="stat-card blue"><div class="stat-label">목표 근접</div><div class="stat-value">${near}</div><div class="stat-sub">80~99% 지표</div></div>
    <div class="stat-card amber"><div class="stat-label">주의 필요</div><div class="stat-value">${warn}</div><div class="stat-sub">60~79% 지표</div></div>
    <div class="stat-card red"><div class="stat-label">미달</div><div class="stat-value">${fail}</div><div class="stat-sub">60% 미만 지표</div></div>
  </div>

  <div class="alert alert-blue">
    💡 <strong>프로그램 매핑</strong>: 우측 "매핑" 버튼으로 각 지표와 연결된 프로그램을 설정하면 업무 진행 현황이 실시간으로 반영됩니다.
    <strong>직접 입력</strong>: "입력" 버튼으로 현재값을 수동으로 입력할 수도 있습니다.
  </div>

  <div class="card">
    <div class="card-title">📋 지표별 달성 현황</div>
    <div class="table-wrap-mobile">
      <table class="indicator-table">
        <thead><tr><th>구분</th><th>지표그룹</th><th>하위지표</th><th>목표(2026)</th><th>현재값</th><th>달성률</th><th>달성여부</th><th>매핑</th><th>작업</th></tr></thead>
        <tbody>${rows}</tbody>

    </div>
  </div>

  <div class="chart-grid">

      <div class="chart-container"><canvas id="chart-year"></canvas></div>

function drawIndicatorChart(id) {
  const ind = IEQAS_PROJECT.indicators.find(i => i.id === id);
  if (!ind) return;
  const el = document.getElementById('chart-ind-' + id);
  if (!el) return;
  const rate = getAchieveRate(ind) || 0;
  const color = getRateColor(rate);
  const colorMap = { green:'#29a745', blue:'#2e5bff', amber:'#f5a623', red:'#e53935' };
  if (charts['ind_'+id]) { try { charts['ind_'+id].destroy(); } catch(e) {} }
  charts['ind_'+id] = new Chart(el, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [Math.min(rate,100), Math.max(0,100-Math.min(rate,100))],
        backgroundColor: [colorMap[color], '#eef0f5'],
        borderWidth: 0
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '70%',
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    },
    plugins: [{
      id: 'centerText',
      beforeDraw(chart) {
        const { ctx, chartArea: { top, bottom, left, right } } = chart;
        ctx.save();
        ctx.font = 'bold 22px IBM Plex Mono, monospace';
        ctx.fillStyle = colorMap[color];
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(rate + '%', (left+right)/2, (top+bottom)/2);
        ctx.restore();
      }
    }]
  });
}

    const near = inds.filter(i => { const r=getAchieveRate(i)||0; return r>=80&&r<100; }).length;
    const warn = inds.filter(i => { const r=getAchieveRate(i)||0; return r>=60&&r<80; }).length;
    const fail = inds.filter(i => (getAchieveRate(i)||0) < 60).length;
    charts.doughnut = new Chart(dEl, {
      type: 'doughnut',
      data: {
        labels: ['달성(100%+)', '근접(80~99%)', '주의(60~79%)', '미달(<60%)'],
        datasets: [{ data: [achieved,near,warn,fail], backgroundColor: ['#29a745','#2e5bff','#f5a623','#e53935'], borderWidth: 0 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }
      }
    });
  }

  // 학기 비교
  const cmpEl = document.getElementById('chart-compare');
  const cmpInds = inds.filter(i => getSemValue(i,'25_2') !== null && getSemValue(i,'26_1') !== null);
  if (cmpEl && cmpInds.length) {
    charts.compare = new Chart(cmpEl, {
      type: 'bar',
      data: {
        labels: cmpInds.map(i => i.name.length>12?i.name.slice(0,12)+'…':i.name),
        datasets: [
          { label: '25-2학기', data: cmpInds.map(i => getSemValue(i,'25_2')), backgroundColor: 'rgba(124,58,237,.5)', borderColor: '#7c3aed', borderWidth: 1 },
          { label: '26-1학기', data: cmpInds.map(i => getSemValue(i,'26_1')), backgroundColor: 'rgba(0,182,168,.5)', borderColor: '#00b6a8', borderWidth: 1 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        scales: { y: { beginAtZero: true }, x: { ticks: { font: { size: 10 } } } }
      }
    });
  }
}

function calcProgress(stages) {
  if (!stages) return 0;
  const v = Object.values(stages);
  return Math.round(v.filter(x => x==='완료'||x==='PASS').length / v.length * 100);
}

          <td style="white-space:nowrap"><button class="btn btn-sm" style="background:var(--amber-lt);color:#7a5000;border:1px solid var(--amber);margin-right:4px" onclick="openInfoPopup('${ind.id}')">📖</button><button class="btn btn-teal btn-sm" onclick="openInputModal('${ind.id}')">✏️ 수정</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

// ══════════════════════════════════════════
//  입력값 및 연계 실적 패널 (교육국제화역량 인증 실적)
// ══════════════════════════════════════════
let _ieqasDraftRecords = [];   // 편집 중 직접입력 행들
let _ieqasDraftTargetDepts = []; // 편집 중 대상 학과

function renderIeqasRecordPanels(ind, d) {
  const schema = IEQAS_INPUT_SCHEMA[ind.id];
  if (!schema) return '';
  _ieqasDraftRecords = Array.isArray(d.inputRecords) ? JSON.parse(JSON.stringify(d.inputRecords)) : [];
  _ieqasDraftTargetDepts = Array.isArray(d.targetDepts) ? [...d.targetDepts] : [];

  let html = '';

  // 대상 학과 설정 (해당 지표만)
  if (schema.targetDeptFilter) {
    html += `
    <div style="background:var(--purple-lt);border-radius:8px;padding:12px;margin:10px 0">
      <div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px">🎯 대상 학과 설정 <span style="font-weight:400;color:var(--gray-4)">(설정한 학과만 아래 학과명 목록에 표시)</span></div>
      <div id="ieqas-targetdept-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${_renderTargetDeptChips()}</div>
      <div style="display:flex;gap:6px">
        <select id="ieqas-targetdept-sel" style="flex:1;padding:6px 8px;border:1px solid var(--gray-2);border-radius:5px;font-size:12px">
          <option value="">학과 선택…</option>
          ${getAllDepartments().map(dp=>`<option value="${dp}">${dp}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-sm" style="background:var(--purple);color:#fff" onclick="addTargetDept()">추가</button>
      </div>
    </div>`;
  }

  // 가. 입력값 (직접 입력) — 각 행을 카드로 표시(좌우 스크롤 없이 필드가 줄바꿈됨)
  html += `
    <div style="margin:10px 0;background:var(--primary-bg,#f4f8ff);border:1px solid var(--gray-1);border-radius:8px;padding:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:12px;font-weight:700;color:var(--heading)">가. 입력값 <span style="font-weight:400;color:var(--gray-4)">(직접 입력)</span></span>
        <button type="button" class="btn btn-sm" style="background:var(--primary);color:#fff;border:none" onclick="addIeqasRecord('${ind.id}')">+ 행 추가</button>
      </div>
      <div id="ieqas-record-list">${_renderIeqasRecordCards(ind.id)}</div>
    </div>`;

  const loadingMsg = '<span style="display:inline-flex;align-items:center;gap:6px"><span class="spin" style="width:12px;height:12px;border:2px solid var(--gray-2);border-top-color:var(--primary);border-radius:50%;display:inline-block"></span>서버에서 불러오는 중…</span>';

  // 나. 연계 결과 — 매핑된 프로그램의 결과보고서 저장 시점 값이 그대로 누적 저장 (계속 쌓임, 현재값에 반영됨)
  const saved = _collectIeqasLinked(ind, d);
  const savedEmpty = !_fbPerfLoaded
    ? loadingMsg
    : '아직 저장된 연계 결과가 없습니다. 매핑된 프로그램의 결과보고서를 저장하면 여기에 누적됩니다.';
  html += `
    <div style="margin:10px 0;background:#f0f7ff;border:1px solid #cfe2ff;border-radius:8px;padding:12px">
      <div style="font-size:12px;font-weight:700;color:#1d4ed8;margin-bottom:8px">나. 연계 결과 <span style="font-weight:400;color:var(--gray-4)">(매핑된 프로그램 결과보고서 저장 시 자동 누적 — 계속 쌓입니다)</span></div>
      ${saved.length
        ? saved.map(r=>_renderIeqasReadCard(schema.linkedCols, r, {removable:true, indId:ind.id, rowId:(r.rowId||r.taskId)})).join('')
        : `<div style="text-align:center;color:var(--gray-3);padding:14px;background:#fff;border-radius:6px;font-size:12px">${savedEmpty}</div>`}
    </div>`;

  return html;
}

// 읽기 전용 카드 (나. 연계 실적 / 다. 연계 결과 공용) — 라벨:값 쌍을 반응형 그리드로 배치
function _renderIeqasReadCard(cols, r, opts) {
  opts = opts || {};
  const cells = cols.map(c => {
    let v = r[c.key];
    let disp = (v!=null && v!=='') ? v : '-';
    if (v!=null && v!=='' && c.key==='year') disp = v+'년';
    if (v!=null && v!=='' && c.key==='budget' && !isNaN(Number(v))) disp = Number(v).toLocaleString()+'원';
    return `<div>
      <div style="font-size:10px;color:var(--gray-3);margin-bottom:2px">${c.label}</div>
      <div style="font-size:12px;color:var(--ink);word-break:break-word">${disp}</div>
    </div>`;
  }).join('');
  const delBtn = opts.removable
    ? `<button type="button" onclick="removeLinkedRecord('${opts.indId}','${opts.rowId}')" title="이 행 삭제 (결과보고서 원본은 유지)" style="position:absolute;top:8px;right:8px;background:var(--red-lt);border:1px solid var(--red);color:var(--red);border-radius:4px;cursor:pointer;font-size:11px;width:24px;height:24px">✕</button>`
    : '';
  return `<div style="position:relative;background:#fff;border:1px solid var(--gray-1);border-radius:6px;padding:10px 12px;margin-bottom:8px">
    ${delBtn}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px">${cells}</div>
  </div>`;
}

function _renderTargetDeptChips() {
  if (!_ieqasDraftTargetDepts.length) return '<span style="font-size:11px;color:var(--gray-3)">설정된 대상 학과 없음 (전체 표시)</span>';
  return _ieqasDraftTargetDepts.map((dp,i)=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--purple);color:var(--purple);border-radius:9999px;padding:2px 8px;font-size:11px">${dp}<span onclick="removeTargetDept(${i})" style="cursor:pointer;font-weight:700">✕</span></span>`).join('');
}
function addTargetDept() {
  const sel = document.getElementById('ieqas-targetdept-sel');
  const v = sel ? sel.value : '';
  if (v && !_ieqasDraftTargetDepts.includes(v)) {
    _ieqasDraftTargetDepts.push(v);
    document.getElementById('ieqas-targetdept-chips').innerHTML = _renderTargetDeptChips();
    // 학과명 select 옵션 갱신
    _refreshDeptSelectsInRecords();
  }
}
function removeTargetDept(i) {
  _ieqasDraftTargetDepts.splice(i,1);
  document.getElementById('ieqas-targetdept-chips').innerHTML = _renderTargetDeptChips();
  _refreshDeptSelectsInRecords();
}
// 대상학과 변경 시 각 행의 학과명 select 옵션 갱신
function _refreshDeptSelectsInRecords() {
  document.querySelectorAll('#ieqas-record-list select[data-col="dept"]').forEach(sel=>{
    const cur = sel.value;
    sel.innerHTML = _deptOptionsHtml(cur);
  });
}
function _deptOptionsHtml(cur) {
  const list = _ieqasDraftTargetDepts.length ? _ieqasDraftTargetDepts : getAllDepartments();
  return '<option value="">선택…</option>' + list.map(dp=>`<option value="${dp}" ${dp===cur?'selected':''}>${dp}</option>`).join('');
}

function _renderIeqasRecordCards(indId) {
  const schema = IEQAS_INPUT_SCHEMA[indId];
  if (!_ieqasDraftRecords.length) {
    return `<div style="text-align:center;color:var(--gray-3);padding:14px;background:#fff;border-radius:6px;font-size:12px">입력된 행이 없습니다. "+ 행 추가"를 눌러주세요.</div>`;
  }
  return _ieqasDraftRecords.map((rec,i)=>{
    const fields = schema.directCols.map(c=>{
      const val = rec[c.key]!=null?rec[c.key]:'';
      const inputStyle = 'width:100%;padding:7px 9px;border:1px solid var(--gray-2);border-radius:6px;font-size:12px;background:#fff;box-sizing:border-box';
      let control;
      if (c.deptFilter) {
        control = `<select data-idx="${i}" data-col="${c.key}" style="${inputStyle}">${_deptOptionsHtml(val)}</select>`;
      } else if (c.type === 'year') {
        control = `<select data-idx="${i}" data-col="${c.key}" style="${inputStyle}">${_ieqasYearOptions(val)}</select>`;
      } else if (c.type === 'sem') {
        control = `<select data-idx="${i}" data-col="${c.key}" style="${inputStyle}"><option value="">선택…</option>${_ieqasSemOptions(val)}</select>`;
      } else {
        const type = c.type==='number'?'number':(c.type==='date'?'date':'text');
        control = `<input type="${type}" data-idx="${i}" data-col="${c.key}" value="${String(val).replace(/"/g,'&quot;')}" style="${inputStyle}"/>`;
      }
      return `<div>
        <div style="font-size:10px;color:var(--gray-3);margin-bottom:3px">${c.label}</div>
        ${control}
      </div>`;
    }).join('');
    return `<div style="position:relative;background:#fff;border:1px solid var(--gray-1);border-radius:6px;padding:10px 12px;margin-bottom:8px">
      <button type="button" onclick="removeIeqasRecord(${i})" title="행 삭제" style="position:absolute;top:8px;right:8px;background:var(--red-lt);border:1px solid var(--red);color:var(--red);border-radius:4px;cursor:pointer;font-size:11px;width:24px;height:24px">✕</button>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 12px;padding-right:28px">${fields}</div>
    </div>`;
  }).join('');
}

function _syncDraftFromDom() {
  // 현재 DOM 입력값을 _ieqasDraftRecords에 반영
  document.querySelectorAll('#ieqas-record-list [data-idx]').forEach(el=>{
    const i = parseInt(el.getAttribute('data-idx'),10);
    const col = el.getAttribute('data-col');
    if (!_ieqasDraftRecords[i]) _ieqasDraftRecords[i] = {};
    _ieqasDraftRecords[i][col] = el.value;
  });
}
function addIeqasRecord(indId) {
  _syncDraftFromDom();
  _ieqasDraftRecords.push({});
  document.getElementById('ieqas-record-list').innerHTML = _renderIeqasRecordCards(indId);
}
function removeIeqasRecord(i) {
  _syncDraftFromDom();
  _ieqasDraftRecords.splice(i,1);
  document.getElementById('ieqas-record-list').innerHTML = _renderIeqasRecordCards(editingIndicatorId);
}

// 나. 연계 결과: 매핑된 프로그램의 결과보고서 저장 시점의 값이 그대로 누적 저장된 것(linkedRecords)을 표시
// (실시간 재계산이 아니라 저장된 값이므로 프로그램 값이 바뀌어도 "초기화"되지 않고 계속 쌓입니다. 저장 위치: Firebase sj_v1/perf → 지표 → linkedRecords)
function _collectIeqasLinked(ind, d) {
  const schema = IEQAS_INPUT_SCHEMA[ind.id];
  if (!schema) return [];
  const list = Array.isArray(d && d.linkedRecords) ? d.linkedRecords : [];
  // 최근 저장순으로 표시
  return list.slice().sort((a,b) => String(b.savedAt||'').localeCompare(String(a.savedAt||'')));
}
// 연계 결과 행 개별 삭제 (오입력 정정용 — 결과보고서 원본 값은 삭제되지 않고, 이 표에서만 제거됩니다)
// 한 프로그램에서 여러 실적이 들어올 수 있으므로 rowId 기준으로 개별 삭제 (구버전 데이터는 taskId로 폴백)
function removeLinkedRecord(indId, rowId) {
  if (!confirm('이 연계 결과 행을 표에서 제거하시겠습니까? (결과보고서 원본 값은 삭제되지 않습니다)')) return;
  const d = getIndicatorData(indId);
  const list = Array.isArray(d.linkedRecords) ? d.linkedRecords : [];
  const next = list.filter(r => (r.rowId || r.taskId) !== rowId);
  saveIndicatorData(indId, { linkedRecords: next });
  toast('삭제되었습니다.', 'success');
  openInputModal(indId);
}

           <div class="detail-row"><span class="detail-label">2026-2학기</span><span class="detail-val" style="color:var(--blue);font-weight:700">${_v262??0}${ind.unit}</span></div>`
        : (mappedVal !== null ? `<div class="detail-row"><span class="detail-label">매핑 자동값</span><span class="detail-val" style="color:var(--blue);font-weight:700">${mappedVal}${ind.unit} (자동계산)</span></div>` : '')}

    <div style="font-size:13px;font-weight:700;color:var(--heading);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-1)">📊 입력값 및 연계 실적</div>
    <input type="hidden" id="input-current-val" value="${d.manualVal??''}"/>
    <div style="font-size:11px;color:var(--gray-4);margin-bottom:8px">${IEQAS_AUTO_INDS.has(id)
      ? '이 지표는 <b>분반별 참여인원</b>에서 자동 연계됩니다. 학기별 실적은 아래 "나. 연계 결과"에서 자동 집계되며, <b>필요하면 직접 입력해 덮어쓸 수 있습니다</b>(비우면 다시 자동 집계값 사용).'
      : '학기별 실적은 아래 "가. 입력값 + 나. 연계 결과"에서 해당 연도·학기 레코드를 자동 집계합니다. 값을 직접 적으면 그 값으로 덮어쓰고, 비우면 다시 자동 집계값을 사용합니다.'} 현재값은 <b>25-2학기 + 26-1학기</b> 실적의 합으로 계산됩니다.</div>

function saveDirectInput() {
  const id = editingIndicatorId;
  const ind = IEQAS_PROJECT.indicators.find(i => i.id === id);
  if (!ind) return;

  // '현재값 직접 입력' 필드는 UI에서 제거됨(숨김 필드로만 유지) — fee/law 특수지표의 자동계산값 전달용.
  // IEQAS 지표는 아래에서 manualVal을 강제로 비워 가.입력값+나.연계결과 자동집계를 쓰게 한다.
  const val = document.getElementById('input-current-val')?.value || '';
  const t2026 = document.getElementById('input-target-2026')?.value;
  const t2027 = document.getElementById('input-target-2027')?.value;
  const t2028 = document.getElementById('input-target-2028')?.value;

  const newTargets = {
    '2026': t2026 !== '' && t2026 !== undefined ? Number(t2026) : ind.targets['2026'],
    '2027': t2027 !== '' && t2027 !== undefined ? Number(t2027) : ind.targets['2027'],
    '2028': t2028 !== '' && t2028 !== undefined ? Number(t2028) : ind.targets['2028'],
  };
  ind.targets['2026'] = newTargets['2026'];
  ind.targets['2027'] = newTargets['2027'];
  ind.targets['2028'] = newTargets['2028'];

  const v26_2 = document.getElementById('input-26-2')?.value;

  // law 세부 데이터
  let lawData = null;
  if (id === 'law') {
    function getLawSem(prefix) {
      var get = function(s) { return Number(document.getElementById(s)?.value)||0; };
      var an1_A = get(prefix+'-an1-A'), an1_B = get(prefix+'-an1-B'), an1_C = get(prefix+'-an1-C');
      var an2_A = get(prefix+'-an2-A'), an2_B = get(prefix+'-an2-B');
      var an1_rate = an1_A > 0 ? Math.round((an1_B-an1_C)/an1_A*1000)/10 : null;
      var an2_rate = an2_A > 0 ? Math.round(an2_B/an2_A*1000)/10 : null;
      return { an1_A, an1_B, an1_C, an1_rate, an2_A, an2_B, an2_rate };
    }
    lawData = { '2025': getLawSem('law-2025'), '2026': getLawSem('law-2026') };
  }
  let feeData = null;
  let finalVal = val !== '' ? Number(val) : '';
  if (id === 'fee') {
    function getSemData(semId) {
      var get = function(sid) { return Number(document.getElementById(sid)?.value)||0; };
      var iC = get(semId+'-intl-count'), iT = get(semId+'-intl-total'), iS = get(semId+'-intl-scholar');
      var dC = get(semId+'-dom-count'), dT = get(semId+'-dom-total'), dS = get(semId+'-dom-scholar');
      var iAvg = iC > 0 ? Math.round((iT-iS)/iC) : 0;
      var dAvg = dC > 0 ? Math.round((dT-dS)/dC) : 0;
      var rate = dAvg > 0 ? Math.round(iAvg/dAvg*1000)/10 : 0;
      return { intlCount:iC, intlTotal:iT, intlScholar:iS, intlAvg:iAvg,
               domCount:dC, domTotal:dT, domScholar:dS, domAvg:dAvg, rate:rate };
    }
    const s252 = getSemData('sem-252');
    const s261 = getSemData('sem-261');
    const s262 = getSemData('sem-262');
    const s271 = getSemData('sem-271');
    // 2025년 평균 (25-2 + 26-1)
    const r2025 = [s252.rate, s261.rate].filter(r=>r>0);
    const avg2025 = r2025.length ? Math.round(r2025.reduce((a,b)=>a+b,0)/r2025.length*10)/10 : null;
    // 2026년 평균 (26-2 + 27-1)
    const r2026 = [s262.rate, s271.rate].filter(r=>r>0);
    const avg2026 = r2026.length ? Math.round(r2026.reduce((a,b)=>a+b,0)/r2026.length*10)/10 : null;
    feeData = { '25-2':s252, '26-1':s261, '26-2':s262, '27-1':s271, avg2025, avg2026 };
    if (avg2026 !== null && val === '') finalVal = avg2026;
  }

  // 교육국제화역량 인증 실적: 가.입력값(직접입력 행) + 대상 학과 저장 (모든 IEQAS 지표 공통)
  let ieqasExtra = {};
  if (IEQAS_INPUT_SCHEMA[id]) {
    _syncDraftFromDom();
    const cleaned = _ieqasDraftRecords.filter(r => Object.values(r).some(v => v !== '' && v != null));
    ieqasExtra.inputRecords = cleaned;   // 직접 입력한 행 저장 (자동 연계 지표도 직접 입력 허용)
    if (IEQAS_INPUT_SCHEMA[id].targetDeptFilter) ieqasExtra.targetDepts = [..._ieqasDraftTargetDepts];
    finalVal = '';  // IEQAS 지표는 수동 현재값 미사용 → 학기실적(가+나) 자동집계 사용
  }

  // 학기 실적 override 저장 (자동/일반 지표 모두 직접 입력 허용 — 비우면 null로 저장되어 자동 집계값 사용)
  const rd = sid => document.getElementById(sid);
  const semOv = sid => (rd(sid) && rd(sid).value !== '' ? Number(rd(sid).value) : null);

  saveIndicatorData(id, {
    manualVal: finalVal,
    achieved25_2: (id==='fee' && feeData?.avg2025) ? feeData.avg2025 : semOv('input-25-2'),
    achieved26_1: semOv('input-26-1'),
    achieved26_2: semOv('input-26-2'),
    targets: newTargets,
    memo: document.getElementById('input-memo').value,
    ...ieqasExtra,
    ...(feeData ? { feeData } : {}),
    ...(lawData ? { lawData } : {})
  });
  closeModal('modal-input');
  toast('저장되었습니다. ✓', 'success');
  showTab(currentTab);
}

function renderLawSemTable(d, ind) {
  const ld = d.lawData || {};
  const target = ind.targets['2026'];

  const configs = {
    '2025': {
      an1: { A:'재학생 수<br><span style="color:var(--blue);font-weight:700">24.4.1 기준</span>', B:'이수자 수<br><span style="color:var(--blue);font-weight:700">24.3.1~25.2.28</span>', C:'이수자 수 중<br><span style="color:var(--blue);font-weight:700">24.8월 입학생</span>' },
      an2: { A:'재학생 수<br><span style="color:var(--teal);font-weight:700">25.4.1 기준</span>', B:'이수자 수<br><span style="color:var(--teal);font-weight:700">25.3.1~25.8.31</span>' }
    },
    '2026': {
      an1: { A:'재학생 수<br><span style="color:var(--blue);font-weight:700">25.4.1 기준</span>', B:'이수자 수<br><span style="color:var(--blue);font-weight:700">25.3.1~26.2.28</span>', C:'이수자 수 중<br><span style="color:var(--blue);font-weight:700">25.8월 입학생</span>' },
      an2: { A:'재학생 수<br><span style="color:var(--teal);font-weight:700">26.4.1 기준</span>', B:'이수자 수<br><span style="color:var(--teal);font-weight:700">26.3.1~26.8.31</span>' }
    }
  };

  function rateColor(rate, tgt) {
    if (rate == null) return 'var(--gray-3)';
    return rate >= tgt ? 'var(--green)' : rate >= tgt*0.8 ? 'var(--blue)' : 'var(--red)';
  }

  var html = '<div style="overflow-x:auto"><table class="indicator-table">';

  ['2025','2026'].forEach(function(yr) {
    var y = ld[yr] || {};
    var cfg = configs[yr];

    // 1안 헤더 + 데이터
    html += '<thead><tr style="background:var(--navy)">' +
      '<th colspan="7" style="text-align:left;font-size:13px">' + yr + ' 평가연도</th>' +
      '</tr>' +
      '<tr>' +
      '<th>구분</th>' +
      '<th>' + cfg.an1.A + '</th>' +
      '<th>' + cfg.an1.B + '</th>' +
      '<th>' + cfg.an1.C + '</th>' +
      '<th>이수율</th><th>목표</th><th>달성률</th>' +
      '</tr></thead><tbody>';

    // 1안 데이터
    var an1_rate = y.an1_rate != null ? y.an1_rate : null;
    var an1_pct = an1_rate != null ? Math.round(an1_rate/target*100) : null;
    html += '<tr>' +
      '<td><strong style="color:var(--blue)">1안</strong></td>' +
      '<td style="font-family:monospace">' + (y.an1_A||'-') + '</td>' +
      '<td style="font-family:monospace">' + (y.an1_B||'-') + '</td>' +
      '<td style="font-family:monospace">' + (y.an1_C||'-') + '</td>' +
      '<td style="font-weight:700;color:var(--blue);font-family:monospace">' + (an1_rate!=null ? an1_rate+'%' : '-') + '</td>' +
      '<td style="font-family:monospace">' + target + '%</td>' +
      '<td style="font-weight:700;color:' + rateColor(an1_rate,target) + ';font-family:monospace">' + (an1_pct!=null ? an1_pct+'%' : '-') + '</td>' +
      '</tr>';

    // 2안 헤더
    html += '<tr style="background:var(--gray-0)">' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">구분</th>' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">' + cfg.an2.A + '</th>' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">' + cfg.an2.B + '</th>' +
      '<th style="background:var(--gray-0);color:var(--gray-4);font-weight:400">-</th>' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">이수율</th>' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">목표</th>' +
      '<th style="background:var(--gray-0);color:var(--text);font-weight:600">달성률</th>' +
      '</tr>';

    // 2안 데이터
    var an2_rate = y.an2_rate != null ? y.an2_rate : null;
    var an2_pct = an2_rate != null ? Math.round(an2_rate/target*100) : null;
    html += '<tr>' +
      '<td><strong style="color:var(--teal)">2안</strong></td>' +
      '<td style="font-family:monospace">' + (y.an2_A||'-') + '</td>' +
      '<td style="font-family:monospace">' + (y.an2_B||'-') + '</td>' +
      '<td style="color:var(--gray-3)">-</td>' +
      '<td style="font-weight:700;color:var(--teal);font-family:monospace">' + (an2_rate!=null ? an2_rate+'%' : '-') + '</td>' +
      '<td style="font-family:monospace">' + target + '%</td>' +
      '<td style="font-weight:700;color:' + rateColor(an2_rate,target) + ';font-family:monospace">' + (an2_pct!=null ? an2_pct+'%' : '-') + '</td>' +
      '</tr>' +
      '<tr><td colspan="7" style="height:8px;background:var(--gray-1)"></td></tr>';

    html += '</tbody>';
  });

  html += '</table></div>' +
    '<div style="margin-top:12px;font-size:12px;color:var(--gray-4);line-height:1.8;padding:10px 14px;background:var(--gray-0);border-radius:6px">' +
    '• 1안: 참여율 = <strong>(B-C)/A × 100</strong> 자동계산 &nbsp;|&nbsp; ' +
    '• 2안: 참여율 = <strong>B/A × 100</strong> 자동계산' +
    '</div>';

  return html;
}

function calcLawRate(groupId) {
  var A = Number(document.getElementById(groupId+'-A')?.value)||0;
  var B = Number(document.getElementById(groupId+'-B')?.value)||0;
  var C = Number(document.getElementById(groupId+'-C')?.value)||0;
  var rateEl = document.getElementById(groupId+'-rate');
  if (!A || !rateEl) return;
  var rate;
  if (groupId.includes('an1')) {
    rate = Math.round((B - C) / A * 1000) / 10;
  } else {
    // 2안: C 없음
    rate = Math.round(B / A * 1000) / 10;
  }
  rateEl.textContent = rate > 0 ? rate + '%' : '-';
  // 현재값 자동 반영 (1안 우선)
  if (groupId.includes('an1')) {
    var curEl = document.getElementById('input-current-val');
    if (curEl && !curEl.value && rate > 0) curEl.value = rate;
  }
}

function calcFeeRateSem(semId) {
  var iC = Number(document.getElementById(semId+'-intl-count')?.value)||0;
  var iT = Number(document.getElementById(semId+'-intl-total')?.value)||0;
  var iS = Number(document.getElementById(semId+'-intl-scholar')?.value)||0;
  var dC = Number(document.getElementById(semId+'-dom-count')?.value)||0;
  var dT = Number(document.getElementById(semId+'-dom-total')?.value)||0;
  var dS = Number(document.getElementById(semId+'-dom-scholar')?.value)||0;
  var iAvg = iC > 0 ? Math.round((iT-iS)/iC) : 0;
  var dAvg = dC > 0 ? Math.round((dT-dS)/dC) : 0;
  var rate = dAvg > 0 ? Math.round(iAvg/dAvg*1000)/10 : 0;
  var iEl = document.getElementById(semId+'-intl-avg');
  var dEl = document.getElementById(semId+'-dom-avg');
  var rEl = document.getElementById(semId+'-rate');
  if (iEl) iEl.value = iAvg > 0 ? iAvg : '';
  if (dEl) dEl.value = dAvg > 0 ? dAvg : '';
  if (rEl) rEl.textContent = rate > 0 ? rate + '%' : '-';
  // 연도별 평균 계산
  calcFeeYearAvg();
}

function calcFeeYearAvg() {
  // 2025년: sem-252 + sem-261 평균
  var r252 = parseRate(document.getElementById('sem-252-rate')?.textContent);
  var r261 = parseRate(document.getElementById('sem-261-rate')?.textContent);
  var r2025El = document.getElementById('fee-result-2026');
  if (r2025El) {
    if (r252 > 0 && r261 > 0) {
      var avg2025 = Math.round((r252 + r261) / 2 * 10) / 10;
      r2025El.textContent = avg2025 + '%';
    } else if (r252 > 0) { r2025El.textContent = r252 + '%'; }
    else if (r261 > 0) { r2025El.textContent = r261 + '%'; }
  }
  // 2026년: sem-262 + sem-271 평균
  var r262 = parseRate(document.getElementById('sem-262-rate')?.textContent);
  var r271 = parseRate(document.getElementById('sem-271-rate')?.textContent);
  var r2026El = document.getElementById('fee-result-2027');
  if (r2026El) {
    if (r262 > 0 && r271 > 0) {
      var avg2026 = Math.round((r262 + r271) / 2 * 10) / 10;
      r2026El.textContent = avg2026 + '%';
      // 현재값 자동 반영
      var curEl = document.getElementById('input-current-val');
      if (curEl && !curEl.value) curEl.value = avg2026;
    } else if (r262 > 0) { r2026El.textContent = r262 + '%'; }
    else if (r271 > 0) { r2026El.textContent = r271 + '%'; }
  }
}

function parseRate(str) {
  if (!str || str === '-') return 0;
  return parseFloat(str.replace('%','')) || 0;
}

}

function _renderMappingRows(mappedIds, filter) {
  const q = (filter || '').trim().toLowerCase();
  const list = tasks.filter(t => {
    if (!q) return true;
    return (t.name||'').toLowerCase().includes(q) || (t.manager||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q);
  });
  if (!tasks.length) return '<div style="color:var(--gray-3);padding:16px;text-align:center">등록된 프로그램이 없습니다.<br>메인 시스템에서 프로그램을 먼저 등록하거나, 잠시 후 다시 시도해 주세요.</div>';
  if (!list.length) return '<div style="color:var(--gray-3);padding:16px;text-align:center">검색 결과가 없습니다.</div>';
  return list.map(t => `
      <div class="mapping-row">
        <input type="checkbox" id="map-${t.id}" ${mappedIds.includes(t.id)?'checked':''} onchange="_updateMappingSelectedCount()"/>
        <label for="map-${t.id}" style="flex:1;cursor:pointer">
          <div class="prog-name">${t.name||'(이름 없음)'}</div>
          <div class="prog-meta">${t.manager||'-'} · ${t.category||'-'} · ${t.semester||'-'}</div>
        </label>
        <div class="prog-value">${t.pIntl?t.pIntl+'명 국제학생':''}</div>
      </div>`).join('');
}

// 검색 입력 시 목록 필터 (체크 상태 보존)
function filterMappingList() {
  const q = document.getElementById('mapping-search')?.value || '';
  // 현재 체크된 것 보존
  const checked = new Set();
  document.querySelectorAll('#mapping-list input[type=checkbox]:checked').forEach(cb => checked.add(cb.id.replace('map-','')));
  // 저장된 매핑 + 현재 체크 합집합
  const mappings = getMappings();
  (mappings[mappingIndicatorId]||[]).forEach(id => checked.add(id));
  const list = document.getElementById('mapping-list');
  list.innerHTML = _renderMappingRows([...checked], q);
  const cntEl = document.getElementById('mapping-count');
  const shown = list.querySelectorAll('.mapping-row').length;
  if (cntEl) cntEl.textContent = q ? `${shown}개 표시` : `전체 ${tasks.length}개`;
  _updateMappingSelectedCount();
}
function _updateMappingSelectedCount() {
  const n = document.querySelectorAll('#mapping-list input[type=checkbox]:checked').length;
  const el = document.getElementById('mapping-selected-count');
  if (el) el.textContent = n;
}

function saveMappingModal() {
  const id = mappingIndicatorId;
  // 현재 화면에 보이는 체크박스 상태
  const shownChecked = new Set();
  const shownAll = new Set();
  document.querySelectorAll('#mapping-list input[type=checkbox]').forEach(cb => {
    const tid = cb.id.replace('map-','');
    shownAll.add(tid);
    if (cb.checked) shownChecked.add(tid);
  });
  // 기존 저장된 매핑 중, 이번에 화면에 보였지만 체크 해제된 것은 제외 / 안 보였던 것은 유지
  const m = getMappings();
  const prev = m[id] || [];
  const result = new Set(shownChecked);
  prev.forEach(tid => { if (!shownAll.has(tid)) result.add(tid); }); // 필터로 안 보였던 기존 선택 유지
  const selectedIds = [...result];
  m[id] = selectedIds;
  saveMappings(m);
  closeModal('modal-mapping');
  toast(`${selectedIds.length}개 프로그램이 매핑되었습니다.`, 'success');
  showTab(currentTab);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o => {

});

  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(() => t.className = 'toast', 2800);
}

function togglePerfSidebar() {
  const sb = document.getElementById('perf-sidebar');
  const ov = document.getElementById('sidebar-overlay-perf');
  if (!sb) return;
  const isOpen = sb.classList.contains('open');
  if (isOpen) {
    sb.classList.remove('open');
    ov.classList.remove('show');
  } else {
    sb.classList.add('open');
    ov.classList.add('show');
  }
}

  const sb = document.getElementById('perf-sidebar');
  const ov = document.getElementById('sidebar-overlay-perf');
  if (sb) sb.classList.remove('open');
  if (ov) ov.classList.remove('show');
}

function openInfoPopup(indicatorId) {
  const detail = INDICATOR_DETAILS[indicatorId];
  if (!detail) return;
  document.getElementById('info-popup-title').textContent = detail.title;
  const badgeColor = detail.badge === '필수지표' ? '#92400e' : detail.badge === '고도화지표' ? 'var(--purple)' : '#1a6e2e';
  const badgeBg = detail.badge === '필수지표' ? '#fef3c7' : detail.badge === '고도화지표' ? 'var(--purple-lt)' : 'var(--green-lt)';
  const body = detail.sections.map(s => `
    <div class="info-section">
      <div class="info-section-title">${s.title}</div>
      <div class="info-section-body">${s.body}</div>
    </div>`).join('');
  document.getElementById('info-popup-body').innerHTML = `
    <div style="margin-bottom:16px">
      <span style="background:${badgeBg};color:${badgeColor};border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700">${detail.badge}</span>
    </div>
    ${body}`;
  document.getElementById('info-popup-overlay').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeInfoPopup() {
  document.getElementById('info-popup-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

// ESC 키로 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeInfoPopup();
